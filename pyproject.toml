[project]
name = "cwola-summer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "astropy>=4.1",
    "h5py>=3.1.0",
    "jupyter>=1.1.1",
    "jupyterlab>=2.3.2",
    "keras>=2.7.0",
    "livelossplot>=0.5.4",
    "matplotlib>=3.3.4",
    "notebook>=6.4.10",
    "numpy>=1.19.5",
    "pandas>=0.25.3",
    "scikit-learn>=0.24.2",
    "seaborn>=0.11.2",
    "tables>=3.7.0",
    "tensorflow>=2.7.4",
    "tqdm>=4.64.1",
    "torch>=2.3.0",
    "wandb>=0.26.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
